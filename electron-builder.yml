appId: com.pixeltoolkit.app
productName: PixelToolkit
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,dev-app-update.yml,CHANGELOG.md,README.md,CodeGuide.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Never package local data, secrets, docs or dev output
  - '!appSettings.config'
  - '!{data,docs,archive,assets,testbed,.screenshots}/**'
asarUnpack:
  - resources/**
win:
  executableName: PixelToolkit
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
npmRebuild: false
